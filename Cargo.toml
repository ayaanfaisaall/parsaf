[package]
name = "parsaf"
version = "0.1.9"
edition = "2024"
authors = ["ayaan faisal <info@ayaanfaisaal.cc>"]
description = "a custom parser, compatible with lexaf, for afsh"
license = "MIT"
repository = "https://github.com/ayaanfaisaall/parsaf"

[lib]
name = "parsaf"
path = "src/lib.rs"

[dependencies]
lexaf = "0.1.9"
miette = { version = "7.0", features = ["fancy"] }
thiserror = "1.0"

